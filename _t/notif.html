<!doctype html><meta charset="utf-8"><style>
body{margin:0;font-family:sans-serif}
#smd-notif-panel { position:fixed; z-index:210; width:min(420px,94vw); max-height:70vh; overflow:auto; background:#fff; border:1px solid #e0e4ec; border-radius:12px; box-shadow:0 12px 40px rgba(15,23,42,.22); display:none; }
.nf-tabs { display:flex; gap:4px; padding:7px 10px; border-bottom:1px solid #eef1f6; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; position:sticky; top:38px; background:#fff; z-index:2; scrollbar-width:none; }
.nf-sec { position:sticky; top:74px; z-index:1; background:#f7f9fc; border-top:1px solid #eef1f6; border-bottom:1px solid #eef1f6; padding:5px 14px; font-size:11.5px; font-weight:700; color:#475569; }
.nf-tab { position:relative; font-size:11.5px; padding:3px 9px; border:1px solid #e0e4ec; background:#fff; border-radius:14px; cursor:pointer; white-space:nowrap; }
.nf-item { padding:9px 10px; }
.nh { position:sticky; top:0; z-index:2; background:#fff; border-bottom:1px solid #eef1f6; padding:9px 12px; display:flex; align-items:center; gap:8px; font-weight:700; font-size:13px; white-space:nowrap; }
#smd-notif-panel{position:fixed;top:40px;left:20px;}
.nf-sec{background:#f7f9fc}
.nf-item{padding:18px 14px;border-bottom:1px solid #eee}
</style>
<div id="smd-notif-panel">
 <div class="nh">🔔 お知らせ</div>
 <div class="nf-tabs"><button class="nf-tab" data-c="order">注文</button><button class="nf-tab" data-c="parcel">荷物</button><button class="nf-tab" data-c="money">お金</button><button class="nf-tab" data-c="todo">要対応</button></div>
 <div class="nf-sec" id="nf-sec-order">🛒 注文</div>
 <div class="nf-item">a</div><div class="nf-item">b</div><div class="nf-item">c</div><div class="nf-item">d</div>
 <div class="nf-sec" id="nf-sec-parcel">📦 荷物</div>
 <div class="nf-item">e</div><div class="nf-item">f</div><div class="nf-item">g</div><div class="nf-item">h</div>
 <div class="nf-sec" id="nf-sec-money">💰 お金</div>
 <div class="nf-item">i</div><div class="nf-item">j</div>
 <div class="nf-sec" id="nf-sec-todo">⚠️ 要対応</div>
 <div class="nf-item">k</div><div class="nf-item">l</div><div class="nf-item">m</div>
</div>
<pre id="out" style="margin-top:520px"></pre>
<script>
const pn=document.getElementById('smd-notif-panel'), out=document.getElementById('out');
function jump(k){
  const sec=pn.querySelector('#nf-sec-'+k); if(!sec) return 'no sec';
  const before=pn.scrollTop;
  sec.scrollIntoView({block:'start'});
  const hd=pn.querySelector('.nh'), tb=pn.querySelector('.nf-tabs');
  const off=(hd?hd.offsetHeight:40)+(tb?tb.offsetHeight:38);
  pn.scrollTop=Math.max(0,pn.scrollTop-off+2);
  return {k, before, afterSIV:'-', final:pn.scrollTop, offsetTop:sec.offsetTop, off};
}
setTimeout(()=>{
  pn.scrollTop=pn.scrollHeight; // 一番下にしてから
  const r=[];
  ['order','parcel','money','todo'].forEach(k=>{ r.push(jump(k)); });
  out.textContent=JSON.stringify({scrollH:pn.scrollHeight, clientH:pn.clientHeight, r},null,1);
},80);
</script>
