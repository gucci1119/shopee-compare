<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#f7f7f8}
body{width:1080px;height:1350px;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#1f2937;box-sizing:border-box;overflow:hidden}
.top{background:#c62828;color:#fff;padding:40px 50px 34px;border-bottom:8px solid #f57c00}
.top h1{margin:0;font-size:76px;letter-spacing:1px;font-weight:900;line-height:1}
.top div{font-size:32px;font-weight:700;margin-top:12px;opacity:.95}
.card{background:#fff;border:3px solid #e5e7eb;border-radius:28px;margin:26px 34px 0;padding:24px 30px}
.route{display:flex;align-items:center;justify-content:center;gap:26px;font-size:96px;line-height:1}
.route .ar{font-size:70px;color:#f57c00;font-weight:900}
.route .lb{font-size:30px;font-weight:800;color:#374151;text-align:center;margin-top:8px}
.cal{display:flex;align-items:flex-end;justify-content:space-between;position:relative;padding:0 40px}
.c{width:300px;text-align:center}
.c .ic{width:190px;height:190px;margin:0 auto;border-radius:22px;border:10px solid currentColor;position:relative;background:#fff}
.c .ic:before{content:"";position:absolute;left:-10px;right:-10px;top:-10px;height:56px;background:currentColor;border-radius:18px 18px 0 0}
.c .ic b{position:absolute;left:0;right:0;top:66px;font-size:96px;line-height:1}
.c .t{font-size:44px;font-weight:900;margin-top:16px}
.s{color:#2563eb}.r{color:#16a34a}
.mid{position:absolute;left:330px;right:330px;top:62px;text-align:center}
.mid .arrow{height:26px;background:#f57c00;border-radius:13px;position:relative;margin-top:30px}
.mid .arrow:after{content:"";position:absolute;right:-34px;top:-24px;border-left:48px solid #f57c00;border-top:37px solid transparent;border-bottom:37px solid transparent}
.mid .late{font-size:46px;font-weight:900;color:#e65100;margin-top:22px}
.big{background:#fff3e0;border-radius:24px;text-align:center;padding:20px 10px 24px}
.big .n{font-size:176px;font-weight:900;color:#c62828;line-height:1}.big .n i{font-style:normal;margin:0 18px}
.big .u{font-size:64px;font-weight:900;color:#c62828;margin-top:-6px}
.big .n2{font-size:62px;font-weight:900;color:#e65100;margin-top:18px}
</style></head><body>
<div class="top"><h1>🇧🇷 DELIVERY TIME</h1><div>Ships from Japan</div></div>
<div class="card">
 <div class="route"><div><div>🇯🇵</div><div class="lb">Japan</div></div><div class="ar">→</div><div>✈️</div><div class="ar">→</div><div><div>🇧🇷</div><div class="lb">Brazil</div></div></div>
</div>
<div class="card" style="padding:30px 20px 28px">
 <div class="cal">
  <div class="c s"><div class="ic"><b>📅</b></div><div class="t">Shopee date</div></div>
  <div class="mid"><div class="arrow"></div><div class="late">LATER</div></div>
  <div class="c r"><div class="ic"><b>📦</b></div><div class="t">Real arrival</div></div>
 </div>
</div>
<div class="card big">
 <div style="font-size:56px;font-weight:900;color:#c62828;letter-spacing:2px;margin-bottom:4px">USUALLY</div>
 <div class="n">3<i>–</i>4</div>
 <div class="u">WEEKS</div>
 <div class="n2">Up to 1–1.5 MONTHS</div><div style="font-size:30px;font-weight:700;color:#6b7280;margin-top:16px">after shipping</div>
</div>
</body></html>
